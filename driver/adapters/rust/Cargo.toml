# SPDX-License-Identifier: MIT
# The Rust adapter of the lws-client driver: runs the operations of driver/PROTOCOL.md with the
# lws-client of ../../../rust.

[package]
name = "lws-driver-adapter-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "The Rust adapter of the lws-client driver (driver/PROTOCOL.md, lws-driver/1)."
publish = false

[dependencies]
lws-client = { path = "../../../rust" }
# Versions and features as in ../../../rust/Cargo.toml, plus the runtime pieces the adapter needs.
tokio = { version = "1.45", default-features = false, features = ["rt", "sync", "time", "net"] }
serde_json = "1.0"
base64 = "0.23"
http = "1.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# A standalone package, not a member of a parent workspace.
[workspace]
