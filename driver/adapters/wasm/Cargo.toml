# SPDX-License-Identifier: MIT
# The WebAssembly adapter of the lws-client driver: runs the operations of driver/PROTOCOL.md with
# the lws-client component of ../../../wasm, in Wasmtime, through the component's interface
# (../../../wasm/wit/lws.wit).

[package]
name = "lws-driver-adapter-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "The WebAssembly adapter of the lws-client driver (driver/PROTOCOL.md, lws-driver/1)."
publish = false

[dependencies]
wasmtime = "49.0.2"
wasmtime-wasi = "49.0.2"
wasmtime-wasi-http = "49.0.2"
serde_json = "1.0"
base64 = "0.23"

# A standalone package, not a member of a parent workspace.
[workspace]
