[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "lws-client"
version = "0.1.0"
description = "Client for the W3C Linked Web Storage (LWS) protocol: storage discovery, CRUD, containers, linksets, OAuth token exchange, notifications, access requests and type search."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Erich Bremer and the lws-client contributors" }]
keywords = ["lws", "linked web storage", "solid", "w3c", "linked data", "oauth"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
crypto = ["cryptography>=42"]
dev = ["cryptography>=42", "pytest>=8", "anyio>=4", "mypy>=1.10", "ruff>=0.6"]

[project.urls]
Homepage = "https://ebremer.github.io/lws-client/"
Repository = "https://github.com/ebremer/lws-client"
Issues = "https://github.com/ebremer/lws-client/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/lws_client"]

[tool.hatch.build.targets.sdist]
include = ["src/lws_client", "tests", "examples", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/lws_client"]

[[tool.mypy.overrides]]
module = ["cryptography.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF022", "UP007"]
