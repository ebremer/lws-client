# SPDX-License-Identifier: MIT
# The lws-client as a WebAssembly component: the Rust client of ../rust, built for wasm32-wasip2,
# behind the interface of wit/lws.wit.
#
#   cargo build --release --target wasm32-wasip2
#
# builds target/wasm32-wasip2/release/lws_client.wasm, a component.

[package]
name = "lws-client-wasm"
version = "0.1.0"
edition = "2024"
# wasip2, the WASI bindings the client's transport uses there.
rust-version = "1.87"
license = "MIT"
description = "The lws-client as a WebAssembly component (WASI 0.2): a client of the W3C Linked Web Storage (LWS) Protocol 1.0."
repository = "https://github.com/ebremer/lws-client"
publish = false

[lib]
name = "lws_client"
crate-type = ["cdylib"]

[dependencies]
lws-client = { path = "../rust", default-features = false, features = ["crypto"] }
wit-bindgen = "0.62.0"
serde_json = "1.0"
http = "1.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# A standalone package, not a member of a parent workspace.
[workspace]
